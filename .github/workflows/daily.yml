name: daily
# After each US close: download market data, then run the accounts
# (corporate actions, month-end rebalances, NAV, kill switch, Telegram).
on:
  schedule:
    - cron: "17 22 * * 1-5"   # 22:17 UTC = 01:17 Nairobi
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "quantlab/**"
      - "config/**"
      - ".github/workflows/daily.yml"

permissions:
  contents: write

concurrency:
  group: ledger-writer      # shared with record-fill: never two writers at once
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
      WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Download and validate market data
        run: python -m quantlab.ingest --to csv
      - name: Telegram connection check
        run: python -m quantlab.notify
      - name: Run accounts
        run: python -m quantlab.daily
      - name: Broker monitoring (NAV, kill switch; no trading after US close)
        env:
          CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
          CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
          CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
        run: python -m quantlab.autotrade --monitor
      - name: Commit data and ledger
        if: always()
        run: |
          git config user.name "quantlab-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ ledger/ config/telegram.json 2>/dev/null || git add data/ ledger/
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "daily: data + ledger $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
