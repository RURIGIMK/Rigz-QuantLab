name: ctrader-connect
# One-time broker connection. Run with no code to get the authorisation link
# (shown in the run summary); approve access, copy the code the dashboard shows,
# then run again with that code.
on:
  workflow_dispatch:
    inputs:
      code: {description: "Authorisation code from the dashboard (leave empty to get the link)", required: false, default: ""}

permissions:
  contents: write

concurrency:
  group: ledger-writer
  cancel-in-progress: false

jobs:
  connect:
    runs-on: ubuntu-latest
    env:
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
      CTRADER_AUTH_CODE: ${{ inputs.code }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
      WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python -m quantlab.brokers.connect | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save encrypted tokens
        if: hashFiles('ledger/secure/ctrader_tokens.enc') != ''
        run: |
          git config user.name "quantlab-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ledger/secure/ ledger/
          git diff --cached --quiet && exit 0
          git commit -m "ctrader: store encrypted tokens"
          git pull --rebase origin main
          git push
      - name: Connection test
        if: hashFiles('ledger/secure/ctrader_tokens.enc') != ''
        run: python -m quantlab.autotrade
