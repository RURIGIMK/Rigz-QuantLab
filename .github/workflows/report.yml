name: report
# End-of-day Telegram report: fresh prices, balance, today's trades and their P&L, open positions.
# 17:47 UTC = 20:47 Nairobi, weekdays.
on:
  schedule:
    - cron: "47 17 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ledger-writer
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Fresh prices
        run: python -m quantlab.ingest --to csv
      - name: Report
        run: python -m quantlab.autotrade --monitor --summary
      - name: Commit
        if: always()
        run: |
          git config user.name "quantlab-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ ledger/
          git diff --cached --quiet && exit 0
          git commit -m "report: $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
