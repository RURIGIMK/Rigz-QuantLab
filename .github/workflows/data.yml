name: market-data
# Downloads daily bars and commits them to data/. Runs after US close on weekdays,
# on manual trigger, and whenever the ingestion code or universe changes.
on:
  schedule:
    - cron: "17 22 * * 1-5"   # 22:17 UTC = 01:17 Nairobi
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "quantlab/ingest_us_etf.py"
      - "quantlab/validate.py"
      - "quantlab/store.py"
      - "config/universe.yaml"
      - ".github/workflows/data.yml"

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Download and validate
        run: python -m quantlab.ingest_us_etf --to csv
      - name: Commit data if changed
        run: |
          git config user.name "quantlab-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: market data update $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
