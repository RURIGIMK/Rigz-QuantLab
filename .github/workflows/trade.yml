name: trade
# Autonomous strategy checks and order execution. Runs every 3 hours on weekdays:
# GitHub can delay or drop scheduled runs, so redundancy keeps the system on time.
# Safe to repeat: a decision is never executed twice (ledger "rebalance" events).
# 15:37 UTC is kept for share CFDs (US market open).
on:
  schedule:
    - cron: "37 15 * * 1-5"
    - cron: "23 */3 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ledger-writer
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
      WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}   # latest state, not the commit that queued this run
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Execute pending rebalances
        run: python -m quantlab.autotrade
      - name: Commit ledger
        if: always()
        run: |
          git config user.name "quantlab-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ledger/
          git diff --cached --quiet && exit 0
          git commit -m "trade: ledger $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
