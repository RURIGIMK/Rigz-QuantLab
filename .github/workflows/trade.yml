name: trade
# Autonomous order execution while US markets are open (share CFDs only trade then).
# 15:37 UTC = 10:37 New York in winter, 11:37 in summer; 18:37 Nairobi.
on:
  schedule:
    - cron: "37 15 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ledger-writer
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
      WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Execute pending rebalances
        run: python -m quantlab.autotrade
      - name: Commit ledger
        if: always()
        run: |
          git config user.name "quantlab-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ledger/
          git diff --cached --quiet && exit 0
          git commit -m "trade: ledger $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
