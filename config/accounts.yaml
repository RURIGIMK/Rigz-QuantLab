# Accounts the daily runner manages. Amounts in USD.
strategy:
  name: dual_momentum
  top_n: 2
  lookback: 252
  cash_symbol: BIL

risk:
  min_order: 1.00          # smallest order the broker app accepts
  max_weight: 0.60         # cap per risky asset (cash proxy exempt)
  cash_buffer: 0.01        # keep 1% uninvested to absorb price moves before you fill
  kill_drawdown: 0.30      # halt new trades if NAV falls 30% from its peak

accounts:
  paper:
    enabled: true
    mode: paper            # fills simulated at the execution-day close
    initial_cash: 5.40     # ~KSh 700, mirrors the planned live account
    fee_bps: 10
  pepperstone_demo:
    enabled: true          # trades automatically once cTrader is connected (ctrader-connect workflow)
    mode: api              # fully autonomous: no human in the loop
    broker: ctrader
    env: demo              # demo | live; the code refuses to trade if the broker's flag disagrees
    account_login: 5377878
    currency: EUR
    market: us_etf         # trades the ETF strategy as share CFDs
    # Only ETFs Pepperstone offers as CFDs (checked 2026-11-25). BIL is signal-only:
    # a "cash" decision means staying flat.
    universe: [SPY, QQQ, IWM, EFA, EEM, TLT, IEF, XLE, BIL]
    max_gross: 1.0         # no leverage for the ETF strategy
    max_pos: 0.6
    symbol_map: {}         # e.g. {SPY: "SPY.US"} if auto-matching misses a symbol
  live:
    enabled: false         # flip to true once the broker account is funded
    mode: manual           # Telegram tickets; you place orders and record fills
    initial_cash: 0.0

tax:
  us_dividend_withholding: 0.30   # US withholds 30% on dividends paid to Kenyan residents (no tax treaty)
