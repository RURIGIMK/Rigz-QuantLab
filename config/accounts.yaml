# Accounts the daily runner manages. Amounts in USD.
strategy:
  name: dual_momentum
  top_n: 2
  lookback: 252
  cash_symbol: BIL

risk:
  min_order: 1.00          # smallest order the broker app accepts
  max_weight: 0.60         # cap per risky asset (cash proxy exempt)
  cash_buffer: 0.01        # keep 1% uninvested to absorb price moves before you fill
  kill_drawdown: 0.30      # halt new trades if NAV falls 30% from its peak

accounts:
  paper:
    enabled: true
    mode: paper            # fills simulated at the execution-day close
    initial_cash: 5.40     # ~KSh 700, mirrors the planned live account
    fee_bps: 10
  fx_bold_5k:
    enabled: true
    mode: api              # fully autonomous: no human in the loop
    broker: ctrader
    env: demo              # demo | live; the code refuses to trade if the broker's flag disagrees
    account_login: 5377878
    currency: EUR
    # Goal (set 2026-11-25): turn KSh 5,000 into KSh 10,000 as fast as possible, on demo.
    # See docs/results/2026-11-25-fx-bold-play.md (41% doubled, 59% wiped, ~6 weeks either way).
    virtual_capital_usd: 38.76     # KSh 5,000 at ~129 KES/USD; the demo is traded as if it held only this
    market: fx
    strategy: fx_bold
    rebalance: daily
    sizing: min_lot                # one 0.01-lot position (~30x leverage at this size)
    max_gross: 60                  # leverage caps sized for the min lot; nothing larger is ever opened
    max_pos: 60
    kill_drawdown: null            # no drawdown kill: bold play only stops at target or stop-out
    take_profit_multiple: 2.0      # halt at KSh 10,000
    stop_out_fraction: 0.15        # halt where a real 1:100 KSh 5,000 account would be margin-closed
    ksh_per_usd: 129.0             # for reporting in shillings
    daily_summary: true            # nightly account message (Telegram + WhatsApp)
  live:
    enabled: false         # flip to true once the broker account is funded
    mode: manual           # Telegram tickets; you place orders and record fills
    initial_cash: 0.0

tax:
  us_dividend_withholding: 0.30   # US withholds 30% on dividends paid to Kenyan residents (no tax treaty)
