# Live Strategy 1 universe: ML-ranked ETF rotation.
# BIL is the "cash" asset the trend filter falls back to.
us_etf:
  - {symbol: SPY, name: US large cap}
  - {symbol: QQQ, name: Nasdaq 100}
  - {symbol: IWM, name: US small cap}
  - {symbol: EFA, name: Developed ex-US}
  - {symbol: EEM, name: Emerging markets}
  - {symbol: TLT, name: Long Treasuries}
  - {symbol: IEF, name: 7-10y Treasuries}
  - {symbol: GLD, name: Gold}
  - {symbol: XLK, name: Tech sector}
  - {symbol: XLE, name: Energy sector}
  - {symbol: XLV, name: Health care sector}
  - {symbol: XLP, name: Consumer staples}
  - {symbol: BIL, name: T-bills (cash proxy)}

history_start: "2005-01-01"

# Forex universe (Yahoo symbols "EURUSD=X" stored as EURUSD). Majors + liquid crosses,
# all tradable as CFDs at Pepperstone.
fx:
  - {symbol: EURUSD}
  - {symbol: GBPUSD}
  - {symbol: USDJPY}
  - {symbol: AUDUSD}
  - {symbol: USDCAD}
  - {symbol: USDCHF}
  - {symbol: NZDUSD}
  - {symbol: EURJPY}
  - {symbol: EURGBP}
  - {symbol: GBPJPY}

# Short-term interest rates (OECD 3-month interbank, monthly, % p.a.) from FRED.
# Used for FX carry: the interest differential is what a CFD swap pays/charges.
rates:
  USD: IR3TIB01USM156N
  EUR: IR3TIB01EZM156N
  GBP: IR3TIB01GBM156N
  JPY: IR3TIB01JPM156N
  AUD: IR3TIB01AUM156N
  CAD: IR3TIB01CAM156N
  CHF: IR3TIB01CHM156N
  NZD: IR3TIB01NZM156N
